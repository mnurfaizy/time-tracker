<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Allow microphone · Time Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f2f6f1; color: #151a16; font: 500 15px/1.6 Manrope, -apple-system, 'Segoe UI', sans-serif; }
    .card { max-width: 440px; margin: 24px; padding: 32px; background: #fff; border-radius: 24px; box-shadow: 0 2px 12px #1e3a2810; text-align: center; }
    .icon { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; background: #e3f1e7; color: #3e8e5e; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #5c655f; margin: 0 0 20px; }
    button { padding: 11px 22px; border: 0; border-radius: 999px; background: #3e8e5e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .ok { color: #2b6b44; font-weight: 700; }
    .err { color: #d24a3f; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
    </div>
    <h1>Allow microphone</h1>
    <p id="status">Time Tracker needs your microphone for dictation. Click the button and choose <b>Allow</b> in the browser prompt.</p>
    <button id="allow" type="button">Allow microphone</button>
  </div>
  <script src="mic.js"></script>
</body>
</html>
